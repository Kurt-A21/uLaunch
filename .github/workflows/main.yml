
name: Build uLaunch

on: [push, pull_request]

jobs:
  uLaunch:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
    - uses: actions/checkout@master
      with:
        submodules: recursive

    # steamui: split into small steps so a failure names its cause (the job logs aren't always readable),
    # and made to work on newer images (root without sudo; Debian's "externally managed" Python refuses pip)
    - name: Install build tools (apt)
      run: |
        SUDO=""; if [ "$(id -u)" != "0" ]; then SUDO="sudo -n"; fi
        $SUDO apt-get update
        $SUDO apt-get install -y patch autoconf automake diffutils pkgconf fakeroot git maven file tar bzip2 zstd zip python3 python3-pip python3-requests python-is-python3

    - name: Install Python requests (for arc)
      run: |
        python3 -c "import requests" 2>/dev/null || python3 -m pip install requests || python3 -m pip install --break-system-packages requests

    - name: Install dkp-toolchain-vars
      run: |
        SUDO=""; if [ "$(id -u)" != "0" ]; then SUDO="sudo -n"; fi
        $SUDO dkp-pacman -Sy --noconfirm --needed dkp-toolchain-vars \
          || $SUDO dkp-pacman --noconfirm -U "https://wii.leseratte10.de/devkitPro/other-stuff/dkp-toolchain-vars-1.0.2-1-any.pkg.tar.xz"

    - name: Set workspace permissions
      run: chmod 777 -R "$GITHUB_WORKSPACE"
    
    - name: Prepare master libnx
      run: |
        git clone https://github.com/switchbrew/libnx
        make -C libnx/
        cp -r libnx/nx/external/bsd/include libnx/nx
    
    - name: Compile
      run: |
        make -j$(nproc) LIBNX=$PWD/libnx/nx/ usystem uloader umenu umanager
        mkdir -p SdOut/ulaunch/themes SdOut/ulaunch/steamui/bg SdOut/ulaunch/steamui/sound
        cp steamui/DeckNight.ultheme SdOut/ulaunch/themes/
        cp -r steamui/overlay/config SdOut/
        cp steamui/README_STEAMUI.md SdOut/
        cp steamui/tools/steamui_media.py steamui/tools/get_homebrew.py steamui/tools/oc_profile.py SdOut/

    # The SD card files themselves (GitHub zips them once for download; unzipping gives the SD layout)
    - uses: actions/upload-artifact@master
      with:
        name: SdOut
        path: SdOut/
        if-no-files-found: error

  steamui-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@master
    - name: Install test dependencies
      run: python3 -m pip install pillow
    - name: Run steamui tests (sanitizers + theme validation)
      run: bash steamui/tests/run_tests.sh
    - name: Run overclock test (sys-clk's own code vs. oc_profile.py profiles)
      run: bash steamui/tests/overclock/run_overclock_test.sh
